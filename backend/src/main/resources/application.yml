spring:
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  application:
    name: questlog-api

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:questlog}
    username: ${POSTGRES_USER:questlog}
    password: ${POSTGRES_PASSWORD:questlog}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Questlog API
    description: Game backlog and personal library API
    version: 1.0.0

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

igdb:
  client-id: ${IGDB_CLIENT_ID}
  client-secret: ${IGDB_CLIENT_SECRET}
  api-url: https://api.igdb.com/v4
  token-url: https://id.twitch.tv/oauth2/token