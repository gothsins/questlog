name: Questlog CI

on:
  pull_request:
    branches:
      - feat/game-reviews
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# PR code runs with read-only repository access and receives no repository secrets.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: questlog_ci
          POSTGRES_USER: questlog_ci
          # The database exists only inside this job. No password is created or logged.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U questlog_ci -d questlog_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Maven tests, including integration tests
        working-directory: backend
        env:
          POSTGRES_DB: questlog_ci
          POSTGRES_USER: questlog_ci
          POSTGRES_PASSWORD: ''
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          SPRING_DATA_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          IGDB_CLIENT_ID: ci-offline
          IGDB_CLIENT_SECRET: ci-offline
        run: |
          export JWT_SECRET="$(openssl rand -base64 32)"
          bash ./mvnw -B -ntp clean test '-Dtest=*Test,*IT'

  frontend:
    name: Frontend build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test
